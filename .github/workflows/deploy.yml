name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "${{ secrets.DEPLOY_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Deploy static files
        run: |
          tar -czf dist.tar.gz -C dist .
          scp -i ~/.ssh/deploy_key -P "${{ secrets.DEPLOY_PORT }}" dist.tar.gz "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/kw/apps/team-role-randomizer/"
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "cd /home/kw/apps/team-role-randomizer && rm -rf public.new && mkdir public.new && tar -xzf dist.tar.gz -C public.new && rm -f dist.tar.gz && rm -rf public.old && if [ -d public ]; then mv public public.old; fi && mv public.new public"
      - name: Verify live deployment
        run: curl --fail --retry 5 --retry-delay 3 "https://${{ secrets.DEPLOY_HOST }}/team-randomizer/"
      - name: Verify auth API boundary
        run: |
          for attempt in 1 2 3 4 5; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' "https://${{ secrets.DEPLOY_HOST }}/api/auth/me")"
            echo "auth boundary status: ${status} (attempt ${attempt})"
            if [ "$status" = "401" ] || [ "$status" = "403" ]; then
              exit 0
            fi
            sleep 3
          done
          exit 1
